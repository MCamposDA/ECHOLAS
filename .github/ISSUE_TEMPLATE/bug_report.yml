name: Bug report
description: Something in the pipeline, dashboard, or Docker image isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this? Include the exact command(s) you ran.
      placeholder: |
        1. Put these files in raw_data/ and reference/...
        2. Run `docker compose up` (or `nextflow run main.nf --mode AUTO`)
        3. See error at module/step ...
    validations:
      required: true

  - type: dropdown
    id: run-method
    attributes:
      label: How did you run ECHOLAS?
      options:
        - Docker (docker compose)
        - Native (nextflow run main.nf)
        - Not sure
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit / version
      description: Output of `git rev-parse HEAD` in your checkout, if known.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste the relevant Nextflow/Docker log output. This will be rendered as a code block, no need for backticks.
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version (if applicable), and anything else relevant to reproducing this.
    validations:
      required: false
