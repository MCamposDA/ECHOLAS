<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ECHOLAS — pipeline dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: #fafaf7;
    color: #1a1a1f;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d8d4c7; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #bcb8aa; }
  @keyframes echolas-pulse {
    0%   { transform: scale(1);   opacity: 0.6; }
    100% { transform: scale(2.4); opacity: 0;   }
  }
  /* For dark log scrollbar */
  .dark-scroll::-webkit-scrollbar-thumb { background: #2a2a2f; }
</style>
</head>
<body>
<template id="__bundler_thumbnail">

    <circle cx="50" cy="50" r="4" fill="#0d6e6e"/>
    <line x1="50" y1="50" x2="76" y2="50" stroke="#0d6e6e" stroke-width="1.2"/>
    <line x1="50" y1="50" x2="38" y2="26" stroke="#1a1a1f" stroke-width="1"/>
    <line x1="50" y1="50" x2="30" y2="70" stroke="#1a1a1f" stroke-width="1"/>
    <line x1="50" y1="50" x2="70" y2="74" stroke="#1a1a1f" stroke-width="1"/>
    <circle cx="38" cy="26" r="2.4" fill="#1a1a1f"/>
    <circle cx="30" cy="70" r="2.4" fill="#1a1a1f"/>
    <circle cx="70" cy="74" r="2.4" fill="#1a1a1f"/>
    <circle cx="76" cy="50" r="3" fill="#0d6e6e"/>
  </svg>
</template>

</html>
